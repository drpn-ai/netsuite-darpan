name: Secret scan

# DAR-BE-197: gitleaks on every push and pull request, over the full git history.
# A secret committed to a repository is how a Shopify app gets delisted (Shopify API
# Terms 2.1.5), so this gate runs on every branch, not only main.
#
# Same approach as darpan-ui and darpan security.yml: the MIT-licensed gitleaks binary,
# pinned to v8.30.1, instead of gitleaks/gitleaks-action@v2 (which needs a paid licence
# for org-owned repos). The tarball is checked against the release's published sha256.
#
# Confirmed false positives go in .gitleaks.toml at the repo root, scoped to exact
# paths and rules, each with a comment saying why it is not a secret.
# A real finding means: rotate the credential first, then clean up. Removing the
# commit does not un-leak it.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Download gitleaks v8.30.1 (pinned, checksum verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Run gitleaks over the full history
        # --redact keeps secret values out of the (possibly public) CI log.
        # Exits 1 on any finding, which fails the job.
        run: /tmp/gitleaks git . --redact --verbose --exit-code 1
